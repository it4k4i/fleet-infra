# --- Provider Settings ---
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

# --- EntryPoints ---
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

# --- Certificates / ACME ---
certificatesResolvers: {}

# --- Persistence (disabled) ---
persistence:
  enabled: false

# --- Service Type ---
service:
  type: NodePort
  nodePorts:
    web: 30080
    websecure: 30443

# --- Dashboard deaktivieren ---
dashboard:
  enabled: false

# --- Logging ---
logs:
  general:
    level: INFO
  access:
    enabled: true

# --- Deployment ---
autoscaling:
  enabled: false

deployment:
  replicas: 1

# --- Security ---
podSecurityContext:
  fsGroup: 65532

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# --- Ressourcen ---
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# --- IngressClass ---
ingressClass:
  enabled: true
  isDefaultClass: false
