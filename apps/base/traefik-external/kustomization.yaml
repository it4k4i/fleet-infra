  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization

  resources:
    - helmrelease.yaml
    - cloudflare-api-token.yaml
    - middlewares/security-headers.yaml
    - tlsoptions/tls13.yaml

  configMapGenerator:
    - name: traefik-external-values
      files:
        - values.yaml

  generatorOptions:
    disableNameSuffixHash: true
