apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: operators # Hier wird der Vault-Config-Operator installiert
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  decryption: 
    provider: sops 
    secretRef: 
      name: sops-age
