  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization

  namespace: traefik-internal

  resources:
    - namespace.yaml
    - helmrelease.yaml
    - middlewares/security-headers.yaml

  configMapGenerator:
    - name: traefik-internal-values
      files:
        - values.yaml

  generatorOptions:
    disableNameSuffixHash: true
