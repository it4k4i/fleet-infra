# ---------------------------------------------------------
# Provider Settings
# Aktiviert die beiden Kubernetes Provider:
# - CRD Provider (für IngressRoute, Middleware, TLSOption)
# - Ingress Provider (für klassische Ingress Objekte)
# ---------------------------------------------------------
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true


# ---------------------------------------------------------
# EntryPoints
# Definiert die Ports, auf denen Traefik extern lauscht.
# Zusätzlich: HTTP → HTTPS Redirect über die offizielle
# Traefik v3 Syntax.
# ---------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"


# ---------------------------------------------------------
# ACME / Let's Encrypt (Cloudflare DNS-01)
# Externes Traefik nutzt ACME, um automatisch Zertifikate
# für öffentliche Domains zu erzeugen.
# ---------------------------------------------------------
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@example.com
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        disablePropagationCheck: false


# ---------------------------------------------------------
# Cloudflare API Token
# Wird als Umgebungsvariable in den Traefik-Pod injiziert.
# Das Secret muss im Namespace existieren.
# ---------------------------------------------------------
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: CF_DNS_API_TOKEN


# ---------------------------------------------------------
# ACME Persistent Storage
# Speichert acme.json dauerhaft, damit Zertifikate nicht
# bei jedem Pod-Restart neu erzeugt werden müssen.
# ---------------------------------------------------------
persistence:
  enabled: true
  name: acme
  size: 1Gi


# ---------------------------------------------------------
# Service
# Externes Traefik wird über einen LoadBalancer exposed.
# (MetalLB oder Cloud-Provider abhängig vom Cluster)
# ---------------------------------------------------------
service:
  type: LoadBalancer


# ---------------------------------------------------------
# Dashboard
# Dashboard bleibt deaktiviert, da es extern nicht
# öffentlich erreichbar sein soll.
# ---------------------------------------------------------
ingressRoute:
  dashboard:
    enabled: false


# ---------------------------------------------------------
# Logging
# Aktiviert Access Logs und setzt General Log Level.
# ---------------------------------------------------------
logs:
  general:
    level: INFO
  access:
    enabled: true


# ---------------------------------------------------------
# Deployment Settings
# Ein einzelner Replica reicht für externes Traefik.
# (HA wäre möglich, aber nicht notwendig)
# ---------------------------------------------------------
deployment:
  replicas: 1


# ---------------------------------------------------------
# Pod Security Context
# Setzt sichere Default‑Permissions für den Container.
# ---------------------------------------------------------
podSecurityContext:
  fsGroup: 65532


# ---------------------------------------------------------
# Container Security Context
# Entfernt alle Linux Capabilities und macht das FS read‑only.
# Sehr gute Hardening‑Defaults.
# ---------------------------------------------------------
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true


# ---------------------------------------------------------
# Ressourcen
# Minimal, aber stabil für externes Traefik.
# ---------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
