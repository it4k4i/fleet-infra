apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres-infra

resources:
  - namespace.yaml
  - helmrelease.yaml
  - bootstrap
  - externalsecret-admin.yaml 
  - externalsecret-media-service.yaml
  - externalsecret-user-service.yaml

configMapGenerator:
  - name: postgres-infra-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
