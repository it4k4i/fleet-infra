apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: postgres-infra
  namespace: postgres-infra
spec:
  interval: 5m

  dependsOn:
    - name: postgres-admin-secret
      namespace: postgres-infra
    - name: vault
      namespace: vault

  chart:
    spec:
      chart: postgresql
      version: 16.3.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  valuesFrom:
    - kind: ConfigMap
      name: postgres-infra-values
      valuesKey: values.yaml
