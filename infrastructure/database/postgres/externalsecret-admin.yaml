apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-admin-secret
  namespace: postgres-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: postgres-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres-infra/admin
        property: postgres-password
