apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-media-service-db
  namespace: postgres-infra
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: bitnami/postgresql:16-debian-11-r0
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-secret
                  key: postgres-password
            - name: SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-service-db
                  key: password
          command:
            - sh
            - -c
            - |
              psql -h postgres-infra -U postgres -d infra <<'EOSQL'
              DO
              $$
              BEGIN
                 IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'media_service') THEN
                    EXECUTE format('CREATE ROLE media_service LOGIN PASSWORD %L', :'SERVICE_PASSWORD');
                 END IF;
              END
              $$;

              CREATE SCHEMA IF NOT EXISTS media_service AUTHORIZATION media_service;
              GRANT ALL ON SCHEMA media_service TO media_service;
              EOSQL
