apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - namespace.yaml
  - helmrelease.yaml
  - minio-kms-token.yaml
  - roles
  - jobs/load-policies.yaml

configMapGenerator:
  - name: vault-values
    files:
      - values.yaml
  - name: vault-policies
    files:
      - policies/postgres-infra-admin.hcl

generatorOptions:
  disableNameSuffixHash: true
