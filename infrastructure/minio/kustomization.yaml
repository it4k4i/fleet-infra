  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization

  namespace: vault

  resources:
    - namespace.yaml
    - helmrelease.yaml
    - kms-config.yaml


  configMapGenerator:
    - name: minio-values
      files:
        - values.yaml

  generatorOptions:
    disableNameSuffixHash: true
