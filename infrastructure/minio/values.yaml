mode: standalone

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi

extraVolumes:
  - name: kms-config
    configMap:
      name: minio-kms-config

extraVolumeMounts:
  - name: kms-config
    mountPath: /etc/minio-kms
    readOnly: true

env:
  - name: MINIO_KMS_KES_CONFIG
    value: /etc/minio-kms/kms.json

ingress:
  enabled: true
  ingressClassName: traefik-internal
  hosts:
    - s3.minio.internal.local
  paths:
    - /
  pathType: Prefix
  port: 9000

console:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    hosts:
      - console.minio.internal.local
    paths:
      - /
    pathType: Prefix
    port: 9001
