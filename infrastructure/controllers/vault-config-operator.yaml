apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-config-operator
  namespace: vault # Oder ein Admin-Namespace
spec:
  interval: 5m
  chart:
    spec:
      chart: vault-config-operator
      version: ">=0.0.0-0" # Holt die neueste Version
      sourceRef:
        kind: HelmRepository
        name: redhat-cop
        namespace: flux-system
  install:
    createNamespace: true
  values:
    installCRDs: true